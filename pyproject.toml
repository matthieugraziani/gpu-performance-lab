[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpu-performance-lab"
version = "1.0.0"
description = "CPU & GPU benchmark with PyTorch + Streamlit dashboard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    "torch>=2.2.0",
    "matplotlib>=3.8.0",
    "streamlit>=1.32.0",
    "plotly>=5.20.0",
    "pandas>=2.2.0",
    "psutil>=5.9.0",
    "notebook>=7.0.0",
    "ipykernel>=6.29.0",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.0.0",
    "nbconvert>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
